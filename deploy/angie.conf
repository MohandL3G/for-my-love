# ============================================================
# For My Love — Angie configuration (hardened static hosting)
# Runs as non-root on read-only rootfs; tmpfs for writable paths.
# ============================================================

pid /tmp/angie.pid;
worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 256;
    multi_accept on;
}

http {
    include /etc/angie/mime.types;
    default_type application/octet-stream;

    charset utf-8;
    server_tokens off;

    access_log /dev/stdout;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    reset_timedout_connection on;
    client_max_body_size 1m;
    large_client_header_buffers 2 8k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;

    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_zone  $binary_remote_addr zone=perip:1m    rate=25r/s;
    limit_conn_zone $binary_remote_addr zone=perconn:1m;

    server {
        listen 8080;
        server_name _;

        root /usr/share/angie/html;
        index index.html;

        limit_req  zone=perip burst=50 nodelay;
        limit_conn perconn 35;

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        # Content-Security-Policy allows self assets, Google fonts, and cdnjs icons/gsap
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; media-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

        location ~ (^|/)\. { return 404; }
        location ~* \.(bak|backup|old|orig|save|swp|swo|tmp|temp|log|sql|zip|tar|tgz|gz|conf|cfg|ini|yml|yaml|env|sh|py)$ { return 404; }

        location ~* \.(woff2|png|jpg|jpeg|webp|svg|ico)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # MP3 audio files: allow caching with validation so replaced audio files take effect promptly
        location ~* \.mp3$ {
            expires -1;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        location ~* \.(css|js)$ {
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }

        # Always revalidate dynamic events.json and index.html
        location ~* (index\.html|events\.json)$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location / {
            expires -1;
            try_files $uri $uri/ =404;
        }
    }
}
